name: SGX Playwright Probe

# DIAGNOSTIC ONLY - writes no data, commits nothing.
#
# Plain HTTP requests cannot read either of these two sources. Tested 18 Aug 2026
# in three environments:
#   GitHub runner + requests : sginvestors 200 w/ empty table body; theedge HTTP 403
#   Local Python + requests  : sginvestors 200 w/ 0 rows;  theedge 200 w/o data blob
#   Local Chrome             : both fully populated
# The differentiator is session state the browser builds up (sginvestors.io carries
# ~811 bytes of JS-set cookies; a requests session gets 0), NOT the IP address.
#
# So: does a REAL browser, driven headless on a GitHub runner, get the content?
# That is the only open question, and this answers it without risking any data.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    name: Can headless Chromium read these sources from CI?
    # The first attempt sat on "playwright install --with-deps" for 17 minutes
    # and had to be cancelled by hand. A hung job must never burn minutes
    # indefinitely again.
    timeout-minutes: 12

    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No --with-deps: that runs apt-get, which is what hung. GitHub's
      # ubuntu-latest image already ships the shared libraries Chromium needs.
      - name: Install Playwright
        timeout-minutes: 5
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: Probe both sources
        run: |
          python - <<'PY'
          import json, re
          from playwright.sync_api import sync_playwright

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36")
          results = {}

          with sync_playwright() as p:
              browser = p.chromium.launch()
              ctx = browser.new_context(user_agent=UA, locale="en-SG",
                                        viewport={"width": 1440, "height": 900})
              page = ctx.new_page()

              # ---------- 1. sginvestors short-sell ----------
              url = "https://sginvestors.io/market/sgx-top-short-sell-by-volume"
              try:
                  # domcontentloaded, not networkidle: the page carries ad
                  # scripts that may never let the network go quiet.
                  resp = page.goto(url, wait_until="domcontentloaded", timeout=45000)
                  page.wait_for_timeout(5000)
                  dom_rows = page.eval_on_selector_all("table tr", "els => els.length")
                  tickers = page.evaluate(
                      "() => (document.documentElement.outerHTML.match(/\\(SGX:[A-Z0-9]+\\)/g)||[]).length")
                  cookie_len = page.evaluate("() => document.cookie.length")
                  # the same in-page fetch that works from a real desktop Chrome
                  raw_rows = page.evaluate("""async () => {
                      const t = await fetch(location.href).then(r => r.text());
                      return (t.match(/<tr/gi) || []).length;
                  }""")
                  results["sginvestors"] = {
                      "status": resp.status if resp else None,
                      "dom_table_rows": dom_rows,
                      "raw_fetch_tr_count": raw_rows,
                      "sgx_ticker_matches": tickers,
                      "cookie_bytes": cookie_len,
                  }
              except Exception as e:
                  results["sginvestors"] = {"error": f"{type(e).__name__}: {str(e)[:200]}"}

              # ---------- 2. The Edge Singapore ----------
              try:
                  resp = page.goto("https://www.theedgesingapore.com/tags/dbs",
                                   wait_until="domcontentloaded", timeout=60000)
                  page.wait_for_timeout(3000)
                  blob = page.evaluate("""() => {
                      const el = document.getElementById('__NEXT_DATA__');
                      if (!el) return null;
                      try {
                          const j = JSON.parse(el.textContent);
                          const arr = j.props.pageProps.data.data || [];
                          return { count: arr.length,
                                   newest: arr.length ? (arr[0].publish_date || '') : '',
                                   title: arr.length ? (arr[0].name || '').slice(0, 70) : '' };
                      } catch (e) { return { parse_error: String(e).slice(0, 120) }; }
                  }""")
                  results["theedgesingapore"] = {
                      "status": resp.status if resp else None,
                      "next_data": blob,
                      "cookie_bytes": page.evaluate("() => document.cookie.length"),
                  }
              except Exception as e:
                  results["theedgesingapore"] = {"error": f"{type(e).__name__}: {str(e)[:200]}"}

              browser.close()

          print("PROBE_RESULT " + json.dumps(results))
          print()
          print("=" * 60)
          print(json.dumps(results, indent=2))
          print("=" * 60)

          ss = results.get("sginvestors", {})
          ed = results.get("theedgesingapore", {})
          ss_ok = (ss.get("dom_table_rows") or 0) > 5
          ed_ok = bool((ed.get("next_data") or {}).get("count"))
          print(f"VERDICT sginvestors={'WORKS' if ss_ok else 'BLOCKED'} "
                f"theedge={'WORKS' if ed_ok else 'BLOCKED'}")
          PY
