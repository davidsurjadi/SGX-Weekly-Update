name: SGX Daily Snapshot

# Picks up the two fast-moving, day-by-day sources that the weekly pipeline
# cannot sensibly cover:
#
#   * short-sell Top-20 (SGinvestors.io) - published per trading day
#   * The Edge Singapore company news    - published continuously
#
# The weekly SGX fund-flow report is genuinely weekly, so it stays in
# sgx-weekly-update.yml; running it more often would just repeat itself.
# Running THIS one every weekday captures all five trading days: each run sees
# the previous session's short-sell figures.
#
# Both fetch steps are append-only and independent - one failing never blocks
# the other, and neither can destroy accumulated history.

on:
  schedule:
    # 01:00 UTC = 09:00 SGT, Monday-Friday
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# A slow news run must never overlap the next day's run.
concurrency:
  group: sgx-daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    name: Capture short-sell and news, rebuild dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # Each source is allowed to fail on its own. The scripts refuse to write
      # anything when a fetch fails, so a bad day leaves existing data intact.
      - name: Fetch short-sell snapshot
        id: shortsell
        continue-on-error: true
        env:
          DATA_DIR: data
        run: python scripts/fetch_short_sell.py

      - name: Fetch The Edge Singapore news
        id: news
        continue-on-error: true
        env:
          DATA_DIR: data
        run: python scripts/fetch_edge_news.py

      - name: Fail if both sources failed
        if: steps.shortsell.outcome == 'failure' && steps.news.outcome == 'failure'
        run: |
          echo "Both short-sell and news fetches failed - nothing was written."
          exit 1

      - name: Rebuild dashboard
        env:
          DATA_DIR: data
        run: |
          python scripts/build_ticker_summary.py
          DATA_DIR=data OUT_FILE="$GITHUB_WORKSPACE/sgx_fund_flow_dashboard.html" \
            python scripts/render_dashboard.py
          cp sgx_fund_flow_dashboard.html index.html

      # Cheap insurance against publishing a truncated or broken page.
      - name: Verify rendered output
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          assert html.rstrip().endswith("</html>"), "index.html is truncated"
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          assert scripts, "no inline script found"
          assert "Latest Reported Results" in html, "results card missing"
          print(f"index.html OK ({len(html)} bytes, {len(scripts)} inline blocks)")
          PY
          node --input-type=module -e "
            import fs from 'fs';
            const h = fs.readFileSync('index.html','utf-8');
            const s = [...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            new Function(s[s.length-1][1]);
            console.log('inline JS parses OK');
          "

      # Commit only when something actually changed, so a quiet day adds no
      # noise to the history.
      - name: Commit and push
        run: |
          git config user.email "automation@sgx-update.local"
          git config user.name "SGX Update Bot"
          git add data/short_sell.csv data/edge_news.csv \
                  data/dashboard_data.json data.json index.html \
                  sgx_fund_flow_dashboard.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily snapshot: short-sell and news ($(date +%Y-%m-%d))"
            git pull --rebase origin main || true
            git push origin HEAD:main
            echo "Pushed."
          fi
