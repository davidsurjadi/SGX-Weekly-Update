name: SGX Short-Sell Daily

# Captures the daily SGX short-sell Top-20 snapshots in the cloud, using
# headless Chromium. Short-sell is genuinely per-trading-day data, so it is the
# one source that gains most from running unattended rather than depending on a
# laptop being switched on.
#
# Plain HTTP cannot read this source from anywhere (measured on a runner AND on
# a local machine - see scripts/fetch_short_sell_browser.py for the numbers).
# A real browser can, including from a GitHub runner, which sgx-playwright-probe
# established: 25 table rows via an in-page fetch, same as desktop Chrome.
#
# Runs weekday mornings SGT. Each morning the site is showing the previous
# trading session, so Mon-Fri picks up all five sessions.
#
# The Edge Singapore news is deliberately NOT here: that host returns HTTP 403
# to GitHub runners even with a real browser, so it stays on the local task.

on:
  schedule:
    # 01:00 UTC = 09:00 SGT, Monday-Friday
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs fight over the same file.
concurrency:
  group: sgx-short-sell-daily
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    name: Capture short-sell snapshot via headless Chromium
    # A browser job that hangs must not run away. The first probe attempt sat
    # for 17 minutes before being cancelled by hand.
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      # No --with-deps: that shells out to apt-get and is what hung the first
      # probe. GitHub's ubuntu-latest image already carries Chromium's libs.
      - name: Install dependencies
        timeout-minutes: 6
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install playwright
          python -m playwright install chromium

      # Writes nothing unless it actually parsed rows; raises otherwise, so a
      # blocked or changed page turns the run red instead of silently no-oping.
      - name: Capture short-sell snapshot
        env:
          DATA_DIR: data
        run: python scripts/fetch_short_sell_browser.py

      # Only rebuild when the CSV actually changed - most runs on a day whose
      # snapshot is already recorded will be a clean no-op.
      - name: Check for new data
        id: changed
        run: |
          if git diff --quiet -- data/short_sell.csv; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "No new short-sell rows; skipping rebuild."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            git diff --numstat -- data/short_sell.csv
          fi

      - name: Rebuild dashboard
        if: steps.changed.outputs.new == 'true'
        env:
          DATA_DIR: data
        run: |
          python scripts/build_ticker_summary.py
          DATA_DIR=data OUT_FILE="$GITHUB_WORKSPACE/sgx_fund_flow_dashboard.html" \
            python scripts/render_dashboard.py
          cp sgx_fund_flow_dashboard.html index.html

      - name: Verify rendered output
        if: steps.changed.outputs.new == 'true'
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          assert html.rstrip().endswith("</html>"), "index.html is truncated"
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          assert scripts, "no inline script found"
          assert "Latest Reported Results" in html, "results card missing"
          print(f"index.html OK ({len(html)} bytes, {len(scripts)} inline blocks)")
          PY
          node --input-type=module -e "
            import fs from 'fs';
            const h = fs.readFileSync('index.html','utf-8');
            const s = [...h.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            new Function(s[s.length-1][1]);
            console.log('inline JS parses OK');
          "

      - name: Commit and push
        if: steps.changed.outputs.new == 'true'
        run: |
          git config user.email "automation@sgx-update.local"
          git config user.name "SGX Update Bot"
          git add data/short_sell.csv data/dashboard_data.json data.json \
                  index.html sgx_fund_flow_dashboard.html
          if git diff --cached --quiet; then
            echo "Nothing staged."
          else
            git commit -m "Short-sell snapshot: $(date +%Y-%m-%d)"
            git pull --rebase origin main || true
            git push origin HEAD:main
            echo "Pushed."
          fi
