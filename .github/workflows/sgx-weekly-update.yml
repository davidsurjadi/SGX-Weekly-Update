name: SGX Weekly Fund Flow Update

# Note: scripts/download_sgx_report.py now queries SGX's JSON content API
# directly instead of scraping HTML (the data-reports page is a JS-rendered
# SPA, so the report list was never present in the raw HTML).

on:
  schedule:
    # Tuesday 8:00 AM SGT = Tuesday 12:00 AM UTC
    - cron: '0 0 * * 2'

  # Allow manual trigger for testing
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only unless granted write access here.
# Without this, every push silently fails with 403 (caught as a "non-critical"
# warning by pipeline_orchestrator.py), so the job reports SUCCESS even though
# nothing actually reaches the repo.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    name: Download, Parse, and Publish SGX Update

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run SGX pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/pipeline_orchestrator.py

      - name: Configure git
        run: |
          git config --global user.email "automation@sgx-update.local"
          git config --global user.name "SGX Update Bot"

      - name: Push changes
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "Weekly update: $(date +%Y-%m-%d)" || true
          git push origin HEAD:main || echo "Nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs
          path: |
            data/
            raw_reports/
          retention-days: 7
          if-no-files-found: ignore
