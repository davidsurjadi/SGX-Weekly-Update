name: SGX Weekly Fund Flow Update

on:
  schedule:
    # Monday 1 AM UTC = Monday 9 AM SGT
    - cron: '0 1 * * 1'

  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    name: Download, Parse, and Publish SGX Update

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run SGX pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/pipeline_orchestrator.py

      - name: Configure git
        run: |
          git config --global user.email "automation@sgx-update.local"
          git config --global user.name "SGX Update Bot"

      - name: Push changes
        if: always()
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "Weekly update: $(date +%Y-%m-%d)" || true
          git push origin HEAD:main || echo "Nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-logs
          path: |
            data/
            raw_reports/
          retention-days: 7
          if-no-files-found: ignore
